name: Cron Trigger

# Runs on a schedule and dispatches the Hello World workflow using a PAT
# (secrets.GH_TOKEN) so the PAT owner is recorded as the run's actor and
# receives GitHub Actions notifications for it.
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  trigger-hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hello World workflow
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh workflow run hello-world.yml --repo ${{ github.repository }}
